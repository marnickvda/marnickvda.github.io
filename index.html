<!doctype html>
<html lang="en" class="dark h-full antialiased" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marnick van der Arend - software engineer</title>
    <meta
      name="description"
      content="Marnick van der Arend, software engineer at Ingka Digital (IKEA) in Utrecht. Software built with care: a selection of what I have built."
    />
    <link rel="canonical" href="https://marnickvda.github.io/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#030712" />

    <!-- What a pasted link shows on LinkedIn, Slack and the like -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://marnickvda.github.io/" />
    <meta property="og:title" content="Marnick van der Arend - software engineer" />
    <meta
      property="og:description"
      content="Software built with care: a selection of what I have built."
    />
    <meta property="og:image" content="https://marnickvda.github.io/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Marnick van der Arend next to the words: Software, built with care"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Marnick van der Arend",
        "jobTitle": "Software engineer",
        "worksFor": { "@type": "Organization", "name": "Ingka Digital" },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Utrecht",
          "addressCountry": "NL"
        },
        "url": "https://marnickvda.github.io/",
        "image": "https://marnickvda.github.io/og.jpg",
        "sameAs": [
          "https://github.com/marnickvda",
          "https://linkedin.com/in/marnickvda"
        ]
      }
    </script>

    <!-- The heading font, fetched early so the heading does not reflow -->
    <link
      rel="preload"
      href="/src/fonts/Mona-Sans.var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body class="flex min-h-full flex-col bg-gray-950">
    <div id="root" class="contents"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
